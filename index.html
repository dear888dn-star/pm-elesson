<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyiha akademiyasi</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3fb;color:#28213a;font:16px/1.55 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px 18px 56px}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top{margin-bottom:18px}.brand{font-weight:800;color:#54339a}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,button{font:inherit;cursor:pointer}.nav button,.tabs button{background:#fff;border:1px solid #ddd2eb;border-radius:9px;padding:8px 11px}.hero{padding:30px;border-radius:21px;background:linear-gradient(130deg,#252052,#754bbe);color:#fff}.hero h1{font-size:clamp(2rem,5vw,3.3rem);margin:8px 0}.hero p{max-width:700px;color:#e5dcff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:22px}.card,.panel{background:#fff;border:1px solid #e5ddec;border-radius:14px;padding:18px;box-shadow:0 5px 17px #503b7410}.card{text-align:left;color:inherit}.card h2{font-size:1.05rem;line-height:1.35}.tag{display:inline-block;background:#efe7ff;color:#6541a4;border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:650}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:19px 0}.tabs button.active,.primary{background:#6945aa!important;border-color:#6945aa!important;color:#fff!important}.back{border:0;background:none;padding:0 0 14px;color:#6541a4}.reading p{margin:0 0 13px;white-space:pre-line}.method{border-left:4px solid #a37adb;padding:10px 14px;background:#faf8fd;margin:11px 0}.game{background:linear-gradient(130deg,#f1ebff,#e9f8fa)}label{display:block;margin:12px 0 6px;font-weight:650}input,select,textarea{width:100%;padding:10px;border:1px solid #d6cae4;border-radius:9px;font:inherit}textarea{min-height:120px}.result,.notice{margin-top:14px;padding:12px;border-radius:10px;background:#eef8f2;color:#286843}.wrong{background:#fff3e4;color:#945f20}.materials a{display:block;color:#6545a7;margin:8px 0;font-weight:650}.form{max-width:480px;margin:20px auto}.form button,.primary{margin-top:16px;padding:10px 14px;border-radius:9px}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid #eee7f3;padding:10px;text-align:left;vertical-align:top}.small{font-size:.85rem;color:#716781}@media(max-width:560px){main{padding:16px 12px}.hero{padding:23px}.grid{grid-template-columns:1fr}.table{font-size:.82rem}}</style><body><main id="app">Yuklanmoqda…</main><script>
const app=document.querySelector('#app'),types=['Krossvord','Klaster','Vaziyatli qaror','WBS klasteri','Vaqt chizig‘i','Krossvord','Sifat detektivi','Jamoa xaritasi','Kommunikatsiya navigatori','Risk matritsasi','Yetkazib beruvchi tanlovi','Manfaatdor tomonlar xaritasi'];let C,M,me=null,current=null,tab='lecture';const esc=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));const norm=s=>String(s).toLowerCase().replace(/[‘’'()–—.,\s]/g,'');async function api(action,body){let r=await fetch('/api?action='+action,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{}),j=await r.json();if(!r.ok)throw Error(j.error||'Amal bajarilmadi.');return j}function header(){return '<header class="top"><button class="brand" onclick="home()">Loyiha AKADEMIYASI</button><nav class="nav"><button onclick="home()">Mavzular</button><button onclick="results()">Natijalarim</button>'+(me?.role==='teacher'?'<button onclick="teacher()">O‘qituvchi kabineti</button>':'')+(me?'<button onclick="logout()">Chiqish</button>':'<button class="primary" onclick="auth()">Kirish</button>')+'</nav></header>'}function home(){current=null;app.innerHTML=header()+'<section class="hero"><span class="tag">LOYB206 • ASOSIY KURS</span><h1>Loyihalarni boshqarish</h1><p>Ma’ruza, amaliy mashg‘ulot, laboratoriya, 3 metod va gamifikatsiya — bir o‘quv maydonida.</p></section><section class="grid">'+C.lectures.map(l=>'<button class="card" onclick="openTopic('+l.id+')"><small>'+String(l.id).padStart(2,'0')+' — MAVZU</small><h2>'+esc(l.title)+'</h2><span class="tag">'+types[l.id-1]+'</span></button>').join('')+'</section>'}function openTopic(id){current=C.lectures.find(x=>x.id===id);tab='lecture';render()}function tabs(){return '<div class="tabs">'+[['lecture','Ma’ruza'],['slides','Taqdimot'],['practice','Amaliy'],['lab','Laboratoriya'],['methods','3 metod'],['game','Bilim maydoni']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>'}function render(){let l=current,body='';if(tab==='lecture')body='<div class="reading">'+l.blocks.filter(x=>x.type!=='image').map(x=>x.type==='h3'?'<h3>'+esc(x.text)+'</h3>':'<p>'+esc(x.text)+'</p>').join('')+'</div>';if(tab==='slides')body=l.presentation?'<div class="materials"><h3>Asl taqdimot</h3><a href="'+l.presentation.file+'" download>PPTXni yuklash</a><a href="'+l.presentation.pdf+'" target="_blank">PDFni ochish</a></div>':'<p>Veb-slaydlar ma’ruza bo‘limida berilgan.</p>';if(tab==='practice')body='<div class="materials">'+l.practicals.map(p=>'<h3>'+esc(p.title)+'</h3><a href="'+p.file+'" download>Amaliy ishlanmani yuklash</a>').join('')+written(l.id,'A'+l.id)+'</div>';if(tab==='lab')body='<div class="materials"><h3>Laboratoriya mashg‘ulotlari</h3>'+((l.labs||[]).map(p=>'<h3>'+esc(p.title)+'</h3><a href="'+p.file+'" download>Laboratoriya faylini yuklash</a>').join('')||'<p>Laboratoriya fayli biriktirilmagan.</p>')+written(l.id,'L'+l.id)+'</div>';if(tab==='methods')body=(M[l.id-1]||[]).map((m,i)=>'<article class="method"><strong>0'+(i+1)+'. '+esc(m.name)+'</strong><p>'+esc(m.format)+' · '+m.time+' daqiqa</p><ol>'+m.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><b>Natija:</b> '+esc(m.output)+'</article>').join('');if(tab==='game')body=game(l);app.innerHTML=header()+'<button class="back" onclick="home()">← Mavzular ro‘yxati</button><section class="panel"><span class="tag">'+l.id+'-MAVZU</span><h1>'+esc(l.title)+'</h1><p>'+esc(l.summary)+'</p>'+tabs()+body+'</section>'}function game(l){let g=l.glossary.slice(0,3),cross=[1,6].includes(l.id);return '<section class="panel game"><span class="tag">'+types[l.id-1]+'</span><h2>'+types[l.id-1]+'</h2><p>'+ (cross?'Ta’rifni o‘qing va javobni katakka yozing.':'Atamalarni tegishli ta’rif bilan moslang.')+'</p><form onsubmit="check(event,'+l.id+')">'+g.map(x=>'<label>'+esc(x.definition)+'</label>'+(cross?'<input data-a="'+esc(x.term)+'" placeholder="Javobingiz">':'<select data-a="'+esc(x.term)+'"><option value="">Javobni tanlang</option>'+g.map(y=>'<option>'+esc(y.term)+'</option>').join('')+'</select>')).join('')+'<button class="primary" type="submit">Tekshirish</button><div id="result"></div></form></section>'}async function check(e,topic){e.preventDefault();let els=[...e.target.querySelectorAll('[data-a]')],ok=els.filter(x=>norm(x.value)===norm(x.dataset.a)).length,feedback=ok===els.length?'Ajoyib! Barcha javoblar to‘g‘ri.':'Qayta aloqani o‘qing va yana urinib ko‘ring.';document.querySelector('#result').innerHTML='<div class="result '+(ok===els.length?'':'wrong')+'">'+ok+' / '+els.length+' to‘g‘ri. '+feedback+'</div>';if(me)try{await api('submit',{topic,kind:'game',assignment:'M'+topic+'-game',answer:els.map(x=>x.value),score:ok,total:els.length,feedback})}catch(x){}}function written(topic,assignment){return '<form class="panel" onsubmit="saveWritten(event,'+topic+',\''+assignment+'\')"><h3>Javobingizni yuboring</h3><textarea required minlength="20" name="answer" placeholder="Tahlil va xulosangizni yozing…"></textarea><button class="primary">O‘qituvchiga yuborish</button><div class="notice" hidden></div></form>'}async function saveWritten(e,topic,assignment){e.preventDefault();if(!me)return auth();try{await api('submit',{topic,kind:'written',assignment,answer:e.target.answer.value,feedback:''});e.target.querySelector('.notice').hidden=false;e.target.querySelector('.notice').textContent='Javob yuborildi. O‘qituvchi baholashini kuting.';e.target.reset()}catch(x){alert(x.message)}}function auth(){app.innerHTML=header()+'<section class="panel form"><h2>Hisobga kirish</h2><div class="tabs"><button class="active" onclick="authForm(\'login\')">Kirish</button><button onclick="authForm(\'register\')">Talaba ro‘yxati</button><button onclick="authForm(\'setup\')">O‘qituvchi sozlash</button></div><div id="authform"></div></section>';authForm('login')}function authForm(mode){document.querySelector('#authform').innerHTML='<form onsubmit="authSubmit(event,\''+mode+'\')">'+(mode!=='login'?'<label>Ism-familiya<input name="name" required></label>':'')+'<label>Email<input type="email" name="email" required></label><label>Parol<input type="password" name="password" minlength="10" required></label>'+(mode==='setup'?'<label>Sozlash kaliti<input type="password" name="setupKey"></label>':'')+'<button class="primary">'+(mode==='login'?'Kirish':mode==='setup'?'O‘qituvchi hisobini ochish':'Hisob yaratish')+'</button></form>'}async function authSubmit(e,mode){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let d=await api('auth',{...f,mode});me=d.user;home()}catch(x){alert(x.message)}}async function logout(){await api('logout',{});me=null;home()}async function results(){if(!me)return auth();try{let r=await api('results');app.innerHTML=header()+'<section class="panel"><h1>Natijalarim</h1>'+(r.length?'<table class="table"><tr><th>Topshiriq</th><th>Natija</th><th>Baho</th><th>Izoh</th></tr>'+r.map(x=>'<tr><td>'+esc(x.assignment)+'</td><td>'+((x.score??'—')+(x.total?'/'+x.total:''))+'</td><td>'+esc(x.grade||'Kutilmoqda')+'</td><td>'+esc(x.feedback||'—')+'</td></tr>').join('')+'</table>':'<p>Natijalar hali yo‘q.</p>')+'</section>'}catch(x){alert(x.message)}}async function teacher(){try{let d=await api('teacher');app.innerHTML=header()+'<section class="panel"><h1>O‘qituvchi kabineti</h1><h2>Javoblar</h2><table class="table"><tr><th>Talaba</th><th>Topshiriq</th><th>Javob</th><th>Baho</th></tr>'+d.submissions.map(x=>'<tr><td>'+esc(x.user?.name)+'</td><td>'+esc(x.assignment)+'</td><td>'+esc(typeof x.answer==='string'?x.answer:JSON.stringify(x.answer))+'</td><td><form onsubmit="grade(event,\''+x.id+'\')"><select name="grade"><option>2</option><option>3</option><option>4</option><option>5</option></select><input name="feedback" value="'+esc(x.feedback||'Yaxshi ish.')+'"><button class="primary">Saqlash</button></form></td></tr>').join('')+'</table><h2>Material qo‘shish</h2><form onsubmit="addContent(event)"><label>Mavzu<select name="topic">'+C.lectures.map(x=>'<option value="'+x.id+'">'+x.id+'. '+esc(x.title)+'</option>').join('')+'</select></label><label>Sarlavha<input name="title" required></label><label>Mazmun<textarea name="body" required></textarea></label><button class="primary">Saqlash</button></form><h2>Fayl yuklash</h2><form onsubmit="upload(event)"><label>Mavzu<select name="topic">'+C.lectures.map(x=>'<option value="'+x.id+'">'+x.id+'. '+esc(x.title)+'</option>').join('')+'</select></label><label>Sarlavha<input name="title" required></label><label>Fayl (4 MB gacha)<input type="file" name="file" required></label><button class="primary">Yuklash</button></form></section>'}catch(x){alert(x.message)}}async function grade(e,id){e.preventDefault();try{await api('grade',{id,grade:e.target.grade.value,feedback:e.target.feedback.value});teacher()}catch(x){alert(x.message)}}async function addContent(e){e.preventDefault();try{await api('content',Object.fromEntries(new FormData(e.target)));e.target.reset();alert('Material saqlandi.')}catch(x){alert(x.message)}}async function upload(e){e.preventDefault();let r=await fetch('/api?action=upload',{method:'POST',body:new FormData(e.target)}),d=await r.json();if(!r.ok)alert(d.error);else{e.target.reset();alert('Fayl yuklandi.')}}Promise.all([fetch('/course-book.json').then(r=>r.json()),fetch('/methods-book.json').then(r=>r.json()),api('me')]).then(([c,m,a])=>{C=c;M=m;me=a.user;home()}).catch(()=>app.textContent='Kurs ma’lumotlari yuklanmadi.');
</script></main></body></html>
